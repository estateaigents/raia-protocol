# Ubiquitous Language — glossary.yaml SSOT (ADR-367)
# Canonical estate nouns, machine-enforced. display_en must equal term modulo casing/underscores.
# No prose duplicate. Changes ADR-class (Eugin approves) per CLAUDE.md rule 13.

- term: person
  table: tbl_persons
  definition: A human the platform knows about (lead, tenant, landlord, agent, staff).
  display_en: Person
  forbidden: [contact, lead, human, client_name]
  exempt:
    - name: contact
      reason: legacy column Contact_Information exists in live DDL
      ADR: ADR-357
    - name: lead
      reason: Gmail/streetsign lead nouns deprecated
      ADR: ADR-321
  scope: [identifiers, filenames, schema, display, cards, docs]
  since: ADR-367
  enforcement: fail
  deprecation_ledger: {synonym: contact, live_count: 0}

- term: asset
  table: tbl_assets
  definition: A real property (flat, house, development, plot).
  display_en: Asset
  forbidden: [property, flat, unit, listing]
  exempt:
    - name: property
      reason: PropertyChip component per ADR-357 D1
      ADR: ADR-357
  scope: [identifiers, filenames, schema, display, cards, docs]
  since: ADR-367
  enforcement: fail
  deprecation_ledger: {synonym: property, live_count: 0}

